<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>识字卡片·正式版</title>
<style>
  :root{--c-bg:#f5f3ee;--c-fg:#2b2b2b;--c-muted:#77726a;--c-card:#fff;--c-border:#ddd6cc;
    --c-accent:#4f7ae0;--c-btn-text:#fff;--c-ok:#16a34a;--c-no:#dc2626;--c-gem:#8b5cf6}
  body.dark{--c-bg:#1c1c20;--c-fg:#ececec;--c-muted:#9a958d;--c-card:#2a2a30;--c-border:#44444c;
    --c-accent:#6b93ea;--c-btn-text:#10131a;--c-ok:#34d374;--c-no:#f05a5a;--c-gem:#b18cff}
  *{box-sizing:border-box}
  body{margin:0;padding:18px;background:var(--c-bg);color:var(--c-fg);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .card{max-width:420px;margin:0 auto}
  .theme-toggle{position:fixed;top:12px;right:12px;z-index:10;font-size:20px;border:1px solid var(--c-border);
    background:var(--c-card);color:var(--c-fg);border-radius:50%;width:40px;height:40px;cursor:pointer}
  .zi{font-size:88px;font-weight:700;text-align:center;margin:10px 0 4px;font-family:"KaiTi","STKaiti",serif}
  .hint{text-align:center;font-size:14px;color:var(--c-muted);margin-bottom:14px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{padding:14px 8px;border:1.5px solid var(--c-border);border-radius:12px;background:var(--c-card);color:var(--c-fg);
    font-size:20px;text-align:center;cursor:pointer;user-select:none;transition:all .15s}
  .opt:hover{border-color:var(--c-accent)}
  .opt.right{border-color:var(--c-ok);background:rgba(34,197,94,.15)}
  .opt.wrong{border-color:var(--c-no);background:rgba(239,68,68,.15)}
  .reveal{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--c-card);border:1.5px solid var(--c-border)}
  .reveal.show{display:block}
  .reveal .py{font-size:22px;font-weight:600}
  .reveal .lesson{font-size:13px;color:var(--c-muted)}
  .next{margin-top:14px;width:100%;padding:13px;border:none;border-radius:12px;
    background:var(--c-accent);color:var(--c-btn-text);font-size:17px;font-weight:700;cursor:pointer}
  .score{display:flex;justify-content:space-between;align-items:center;font-size:15px}
  .diamonds{color:var(--c-gem);font-weight:700}
  .done{text-align:center;padding:26px 10px}
  .done .big{font-size:46px}
  .done .msg{margin:10px 0 14px;font-size:16px;color:var(--c-muted)}
  .result{margin:12px 0;padding:12px;border:1.5px dashed var(--c-border);border-radius:12px;
    background:var(--c-card);font-size:14px;text-align:left;user-select:all;word-break:break-all}
  .feedback{text-align:center;font-size:15px;height:22px;margin-top:10px;font-weight:600}
  .fb-ok{color:var(--c-ok)} .fb-no{color:var(--c-no)}
  button.small{padding:10px;width:100%;margin-top:8px;border:1.5px solid var(--c-border);border-radius:12px;
    background:var(--c-card);color:var(--c-fg);font-size:15px;cursor:pointer}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()" title="切换明暗">☀️</button>
<div class="card" id="app"></div>
<script>
function toggleTheme(){
  const d = document.body.classList.toggle("dark");
  document.querySelector(".theme-toggle").textContent = d ? "☀️" : "🌙";
  try { localStorage.setItem("theme", d ? "dark" : "light"); } catch(e){}
}
try { if (localStorage.getItem("theme") !== "light") { document.body.classList.add("dark"); document.querySelector(".theme-toggle").textContent = "☀️"; } }
catch(e){ document.body.classList.add("dark"); document.querySelector(".theme-toggle").textContent = "☀️"; }
</script>

"第8课"},{"zi":"教","py":"jiào","lesson":"第8课"},{"zi":"道","py":"dào","lesson":"第8课"},{"zi":"专","py":"zhuān","lesson":"第8课"},{"zi":"幼","py":"yòu","lesson":"第8课"},{"zi":"玉","py":"yù","lesson":"第8课"},{"zi":"知","py":"zhī","lesson":"第8课"},{"zi":"义","py":"yì","lesson":"第8课"},{"zi":"端","py":"duān","lesson":"第9课"},{"zi":"粽","py":"zòng","lesson":"第9课"},{"zi":"节","py":"jié","lesson":"第9课"},{"zi":"总","py":"zǒng","lesson":"第9课"},{"zi":"煮","py":"zhǔ","lesson":"第9课"},{"zi":"盼","py":"pàn","lesson":"第9课"},{"zi":"米","py":"mǐ","lesson":"第9课"},{"zi":"枣","py":"zǎo","lesson":"第9课"},{"zi":"甜","py":"tián","lesson":"第9课"},{"zi":"分","py":"fēn","lesson":"第9课"},{"zi":"鲜","py":"xiān","lesson":"第9课"},{"zi":"肉","py":"ròu","lesson":"第9课"},{"zi":"了","py":"le","lesson":"第9课"},{"zi":"册","py":"cè","lesson":"语文园地四"},{"zi":"支","py":"zhī","lesson":"语文园地四"},{"zi":"台","py":"tái","lesson":"语文园地四"},{"zi":"电","py":"diàn","lesson":"语文园地四"},{"zi":"视","py":"shì","lesson":"语文园地四"},{"zi":"部","py":"bù","lesson":"语文园地四"},{"zi":"机","py":"jī","lesson":"语文园地四"},{"zi":"衣","py":"yī","lesson":"语文园地四"},{"zi":"裤","py":"kù","lesson":"语文园地四"},{"zi":"被","py":"bèi","lesson":"语文园地四"}];
const ROUND = 10;
const state = {deck:[], i:0, score:0, diamond:0, answered:false, results:[], phase:"title"};

function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);}

function render(){
  const app = document.getElementById("app");
  if (state.phase==="title"){
    app.innerHTML = `<div class="done">
      <div class="big">📚</div>
      <div class="msg">一年级下册 · 识字测试（第1-9课 + 园地一~四）<br>每轮 ${ROUND} 个字，准备好了吗？</div>
      <button class="next" onclick="startRound()">开始测试 ▶</button></div>`;
    return;
  }
  if (state.phase==="result"){ renderResult(); return; }
  const c = state.deck[state.i];
  const pool = CARDS.filter(x=>x.zi!==c.zi).map(x=>x.py);
  const opts = shuffle([c.py, ...shuffle(pool).slice(0,3)]);
  app.innerHTML = `
    <div class="score"><span>第 ${state.i+1} / ${state.deck.length} 张</span><span class="diamonds">💎 × ${state.diamond}</span></div>
    <div class="zi">${c.zi}</div>
    <div class="hint">这个字怎么读？选一选吧 👇</div>
    <div class="opts">${opts.map(o=>`<div class="opt" data-py="${o}" onclick="pick(this)">${o}</div>`).join("")}</div>
    <div class="feedback" id="fb"></div>
    <div class="reveal" id="reveal">
      <div class="py">${c.zi} ${c.py}</div>
      <div class="lesson">📖 来自 ${c.lesson}</div>
    </div>
    <button class="next" id="nextBtn" style="display:none" onclick="nextCard()">下一张 →</button>`;
}

function startRound(){
  state.deck = shuffle(CARDS).slice(0,ROUND);
  state.i=0; state.score=0; state.diamond=0; state.results=[]; state.answered=false;
  state.phase="quiz"; render();
}

function pick(el){
  if (state.answered) return;
  state.answered = true;
  const c = state.deck[state.i];
  const ok = el.dataset.py === c.py;
  el.classList.add(ok?"right":"wrong");
  if (!ok) [...document.querySelectorAll(".opt")].find(o=>o.dataset.py===c.py).classList.add("right");
  if (ok){ state.score++; state.diamond++; }
  state.results.push({zi:c.zi, py:c.py, lesson:c.lesson, ok});
  const fb = document.getElementById("fb");
  fb.textContent = ok ? "✓ 答对啦！💎 +1" : "✗ 没关系，记住它！";
  fb.className = "feedback " + (ok?"fb-ok":"fb-no");
  const rv = document.getElementById("reveal"); rv.classList.add("show");
  const nb = document.getElementById("nextBtn");
  nb.textContent = state.i===state.deck.length-1 ? "看结果 🏁" : "下一张 →";
  nb.style.display = "block";
  nb.scrollIntoView({behavior:"smooth", block:"nearest"});
  document.querySelector(".diamonds").textContent = "💎 × " + state.diamond;
}

function nextCard(){
  if (state.i >= state.deck.length-1){ finishRound(); return; }
  state.i++; state.answered=false; render();
}

function finishRound(){
  state.phase="result";
  try {
    const h = JSON.parse(localStorage.getItem("history")||"[]");
    h.push({date:new Date().toISOString().slice(0,10),
      right: state.results.filter(r=>r.ok).map(r=>r.zi),
      wrong: state.results.filter(r=>!r.ok).map(r=>r.zi)});
    localStorage.setItem("history", JSON.stringify(h));
  } catch(e){}
  render();
}

function renderResult(){
  const wrong = state.results.filter(r=>!r.ok);
  const right = state.results.filter(r=>r.ok);
  const app = document.getElementById("app");
  const summary = "识字测试结果：答对 " + state.score + "/" + state.results.length +
    "；对：" + right.map(r=>r.zi).join("") +
    (wrong.length ? "；错：" + wrong.map(r=>r.zi+"("+r.py+","+r.lesson+")").join("、") : "；全对！");
  app.innerHTML = `<div class="done">
    <div class="big">${wrong.length===0?"🏆":"🎉"}</div>
    <div class="msg">本轮答对 <b>${state.score}</b> / ${state.results.length}<br>
    获得 <span class="diamonds">💎 × ${state.diamond}</span> 钻石！
    ${wrong.length?`<br>错字：${wrong.map(r=>`<b>${r.zi}</b>`).join("、")}`:""}</div>
    <div class="result" id="summary">${summary}</div>
    <button class="next" onclick="copyResult()">📋 复制结果（发给老师）</button>
    <button class="small" onclick="startRound()">再来一轮 🔄</button></div>`;
}

function copyResult(){
  const s = document.getElementById("summary").textContent;
  const done = ()=>{ document.querySelector(".next").textContent = "✅ 已复制，去微信粘贴给老师吧！"; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done).catch(()=>fallbackCopy(s,done));
  else fallbackCopy(s,done);
}
function fallbackCopy(s,done){
  const ta = document.createElement("textarea"); ta.value=s; document.body.appendChild(ta);
  ta.select(); try{document.execCommand("copy"); done();}catch(e){alert(s);} document.body.removeChild(ta);
}

render();
</script>
</body>
